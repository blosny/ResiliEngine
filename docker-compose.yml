services:
  # Veritabanı Servisi
  db:
    image: postgres:15
    container_name: resiliengine_db
    restart: always
    environment:
      POSTGRES_USER: resiliengine_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password123}
      POSTGRES_DB: resiliengine_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Yusuf Arda'nın NestJS Backend Servisi
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resiliengine_backend
    ports:
      - "3000:3000"
    depends_on:
      - db
      - local-ai # Yerel AI hazır olmadan backend tam kapasite çalışmasın
    environment:
      DB_HOST: db 
      DB_PASSWORD: ${DB_PASSWORD:-password123}
      DATABASE_URL: postgres://resiliengine_user:${DB_PASSWORD:-password123}@db:5432/resiliengine_db
      # SCRUM-36/37 için gereken adresler:
      LOCAL_AI_URL: http://local-ai:11434/api/generate
      AI_SERVICE_URL: http://ai-service:8000/analyze

  # Tunahan'ın AI Servisi (Gemini Köprüsü)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: resiliengine_ai
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - POSTGRES_HOST=db
      - POSTGRES_USER=resiliengine_user
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password123}
      - POSTGRES_DB=resiliengine_db

  # Taha'nın eklediği Yerel AI Servisi (Ollama) - SCRUM-36/37'nin Kalbi
  local-ai:
    image: ollama/ollama:latest
    container_name: resiliengine_local_ai
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Eğer NVIDIA ekran kartın varsa aşağıdaki bloğu aktif edebilirsin:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  frontend:
    build: ./frontend
    container_name: resiliengine_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:3000

volumes:
  postgres_data:
  ollama_data: # Modellerin her seferinde silinmemesi için gerekli
